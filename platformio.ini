[platformio]
src_dir = firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<main.cpp>
lib_ldf_mode = deep+
extra_scripts = pre:scripts/include_network.py
board_build.partitions = huge_app.csv
lib_deps =
  Networking
  ESP32Async/ESPAsyncWebServer
  bblanchon/ArduinoJson@^6.21.5
  lovyan03/LovyanGFX
  olikraus/U8g2
monitor_speed = 115200

[env:tftprobe]
extends = env:esp32dev
build_src_filter = +<tft_probe.cpp>
lib_deps =
  adafruit/Adafruit GC9A01A
